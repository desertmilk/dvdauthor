name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            arch: x86_64
            asset: dvdauthor-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            name: linux-arm64
            arch: arm64
            asset: dvdauthor-linux-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config gettext m4 flex bison docbook-utils libdvdread-dev libpng-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libfribidi-dev

      - name: Bootstrap and build
        shell: bash
        run: |
          set -eux
          ./bootstrap
          ./configure --prefix="$PWD/_install"
          CPU_COUNT="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          make -j"$CPU_COUNT"
          make install-strip

          mkdir -p release
          tar -C "$PWD/_install" -czf "release/${{ matrix.asset }}" .

      - name: Upload shared documentation
        uses: actions/upload-artifact@v4
        with:
          name: shared-docs
          path: _install/share
          retention-days: 1

      - name: Smoke test installed binaries
        shell: bash
        run: |
          set -eux
          test -x "$PWD/_install/bin/dvdauthor"
          dvdauthor_help="$($PWD/_install/bin/dvdauthor --help 2>&1 || true)"
          printf '%s\n' "$dvdauthor_help" | grep -Eq 'DVDAuthor::dvdauthor|syntax: dvdauthor'
          if [[ -x "$PWD/_install/bin/dvdunauthor" ]]; then
            dvdunauthor_help="$($PWD/_install/bin/dvdunauthor --help 2>&1 || true)"
            printf '%s\n' "$dvdunauthor_help" | grep -Eq 'dvdunauthor|syntax:'
          fi

      - name: Create source distribution
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eux
          make dist
          cp -f ./*.tar.gz release/

      - name: Create release checksums
        shell: bash
        run: |
          set -eux
          cd release
          sha256sum ./dvdauthor-* > checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: release/*

  build-macos:
    name: ${{ matrix.name }}
    needs: build-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted Intel macOS runners are not available, so keep this target disabled until it is once again available.
          # - os: macos-13
          #   name: macos-x86_64
          #   arch: x86_64
          #   asset: dvdauthor-macos-x86_64.tar.gz
          - os: macos-14
            name: macos-arm64
            arch: arm64
            asset: dvdauthor-macos-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          brew update
          brew untap aws/tap || true
          brew install autoconf automake libtool pkg-config gettext m4 flex bison libdvdread libpng libxml2 fontconfig freetype fribidi

      - name: Bootstrap and build
        shell: bash
        run: |
          set -eux
          HOMEBREW_PREFIX="$(brew --prefix)"
          export PATH="$HOMEBREW_PREFIX/opt/bison/bin:$HOMEBREW_PREFIX/opt/flex/bin:$PATH"
          export CPPFLAGS="-I$HOMEBREW_PREFIX/include -I$HOMEBREW_PREFIX/opt/libxml2/include -I$HOMEBREW_PREFIX/opt/libdvdread/include -I$HOMEBREW_PREFIX/opt/libpng/include -I$HOMEBREW_PREFIX/opt/fontconfig/include -I$HOMEBREW_PREFIX/opt/freetype/include -I$HOMEBREW_PREFIX/opt/fribidi/include ${CPPFLAGS:-}"
          export LDFLAGS="-L$HOMEBREW_PREFIX/lib -L$HOMEBREW_PREFIX/opt/libxml2/lib -L$HOMEBREW_PREFIX/opt/libdvdread/lib -L$HOMEBREW_PREFIX/opt/libpng/lib -L$HOMEBREW_PREFIX/opt/fontconfig/lib -L$HOMEBREW_PREFIX/opt/freetype/lib -L$HOMEBREW_PREFIX/opt/fribidi/lib ${LDFLAGS:-}"
          export PKG_CONFIG_PATH="$HOMEBREW_PREFIX/lib/pkgconfig:$HOMEBREW_PREFIX/opt/libxml2/lib/pkgconfig:$HOMEBREW_PREFIX/opt/libdvdread/lib/pkgconfig:$HOMEBREW_PREFIX/opt/libpng/lib/pkgconfig:$HOMEBREW_PREFIX/opt/fontconfig/lib/pkgconfig:$HOMEBREW_PREFIX/opt/freetype/lib/pkgconfig:$HOMEBREW_PREFIX/opt/fribidi/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CPATH="$HOMEBREW_PREFIX/include:${CPATH:-}"
          export LIBRARY_PATH="$HOMEBREW_PREFIX/lib:${LIBRARY_PATH:-}"

          ./bootstrap
          ./configure --prefix="$PWD/_install"
          CPU_COUNT="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          # macOS: skip doc build (SGML DocBook toolchain unavailable via Homebrew)
          # Documentation will be added from Linux build below
          make -j"$CPU_COUNT" -C src
          make install-strip -C src

          mkdir -p release
          tar -C "$PWD/_install" -czf "release/${{ matrix.asset }}" .

      - name: Download shared documentation
        uses: actions/download-artifact@v4
        with:
          name: shared-docs
          path: shared-docs-tmp

      - name: Add shared documentation to release
        shell: bash
        run: |
          set -eux
          # Extract the tarball to add docs while preserving the final install layout.
          cd release
          tar -xzf "${{ matrix.asset }}"

          # actions/upload-artifact can preserve a nested share/ directory or flatten the contents of the uploaded directory. Normalize both cases so the final archive contains the expected $prefix/share/man tree.
          mkdir -p share
          if [[ -d ../shared-docs-tmp/share ]]; then
            cp -a ../shared-docs-tmp/share/. share/
          else
            cp -a ../shared-docs-tmp/. share/
          fi

          # Repackage with docs included
          rm -f "${{ matrix.asset }}"
          tar -czf "${{ matrix.asset }}" .
          cd ..

      - name: Rename artifact for architecture
        shell: bash
        run: |
          set -eux
          mv -f "release/${{ matrix.asset }}" "release/dvdauthor-${{ matrix.name }}.tar.gz"

      - name: Smoke test installed binaries
        shell: bash
        run: |
          set -eux
          # Extract tarball temporarily to verify contents
          mkdir -p _test_install
          tar -C _test_install -xzf "release/dvdauthor-${{ matrix.name }}.tar.gz"
          test -x "_test_install/bin/dvdauthor"
          dvdauthor_help="$(_test_install/bin/dvdauthor --help 2>&1 || true)"
          printf '%s\n' "$dvdauthor_help" | grep -Eq 'DVDAuthor::dvdauthor|syntax: dvdauthor'
          if [[ -x "_test_install/bin/dvdunauthor" ]]; then
            dvdunauthor_help="$(_test_install/bin/dvdunauthor --help 2>&1 || true)"
            printf '%s\n' "$dvdunauthor_help" | grep -Eq 'dvdunauthor|syntax:'
          fi
          # Verify docs were included
          test -d "_test_install/share/man" || { echo "Documentation missing!"; exit 1; }

      - name: Create release checksums
        shell: bash
        run: |
          set -eux
          cd release
          shasum -a 256 dvdauthor-${{ matrix.name }}.tar.gz > checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: release/*

  build-windows:
    name: ${{ matrix.name }}
    needs: build-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            arch: x86_64
            asset: dvdauthor-windows-x86_64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            gettext
            gettext-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libdvdread
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fribidi
            zip
            unzip

      - name: Bootstrap and build
        shell: msys2 {0}
        run: |
          set -eux
          ./bootstrap
          ./configure --prefix="$PWD/_install"
          CPU_COUNT="$(nproc 2>/dev/null || echo 2)"
          make -j"$CPU_COUNT" -C src
          make install-strip -C src

          mkdir -p release
          cd _install
          zip -r "../release/${{ matrix.asset }}" .
          cd ..

      - name: Download shared documentation
        uses: actions/download-artifact@v4
        with:
          name: shared-docs
          path: shared-docs-tmp

      - name: Add shared documentation to release
        shell: msys2 {0}
        run: |
          set -eux
          cd release
          unzip -o "${{ matrix.asset }}"

          mkdir -p share
          if [[ -d ../shared-docs-tmp/share ]]; then
            cp -a ../shared-docs-tmp/share/. share/
          else
            cp -a ../shared-docs-tmp/. share/
          fi

          rm -f "${{ matrix.asset }}"
          zip -r "${{ matrix.asset }}" .
          cd ..

      - name: Smoke test installed binaries
        shell: msys2 {0}
        run: |
          set -eux
          mkdir -p _test_install
          unzip -o "release/${{ matrix.asset }}" -d _test_install
          test -f "_test_install/bin/dvdauthor.exe"
          dvdauthor_help="$(_test_install/bin/dvdauthor.exe --help 2>&1 || true)"
          printf '%s\n' "$dvdauthor_help" | grep -Eq 'DVDAuthor::dvdauthor|syntax: dvdauthor'
          if [[ -f "_test_install/bin/dvdunauthor.exe" ]]; then
            dvdunauthor_help="$(_test_install/bin/dvdunauthor.exe --help 2>&1 || true)"
            printf '%s\n' "$dvdunauthor_help" | grep -Eq 'dvdunauthor|syntax:'
          fi
          test -d "_test_install/share/man" || { echo "Documentation missing!"; exit 1; }

      - name: Create release checksums
        shell: msys2 {0}
        run: |
          set -eux
          cd release
          sha256sum ./dvdauthor-* > checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize artifacts for release
        shell: bash
        run: |
          set -eux
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.txt" \) | while read file; do
            cp "$file" release-files/
          done

      - name: Create release checksums
        shell: bash
        run: |
          set -eux
          cd release-files
          sha256sum ./dvdauthor-* > checksums.txt

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## 📦 Downloads

          | Platform | Architecture | Archive |
          | :--- | :--- | :--- |
          | **Linux** | x86_64 | [dvdauthor-linux-x86_64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dvdauthor-linux-x86_64.tar.gz) |
          | **Linux** | arm64 | [dvdauthor-linux-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dvdauthor-linux-arm64.tar.gz) |
          | **macOS** | arm64 | [dvdauthor-macos-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dvdauthor-macos-arm64.tar.gz) |
          | **Windows** | x86_64 | [dvdauthor-windows-x86_64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dvdauthor-windows-x86_64.zip) |

          **Checksums:** [checksums.txt](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/checksums.txt)
          
          *(Note: macOS x86_64 builds are currently disabled).*

          ## 🚀 Installation

          Extract the archive that matches your platform and install it into your preferred prefix (such as `/usr/local`) or binary path.

          **macOS / Linux Example:**
          ```bash
          tar -xzf dvdauthor-macos-arm64.tar.gz
          sudo cp -a . /usr/local/
          ```
          
          **Windows:**
          Extract `dvdauthor-windows-x86_64.zip`, place the extracted folders in your preferred location, and add the resulting `bin` directory to your system `Path`.

          ## 🔐 Verify the download

          To confirm the integrity of your specific download without getting errors for the files you skipped, run:

          **Linux:**
          ```bash
          sha256sum --ignore-missing -c checksums.txt
          ```

          **macOS:**
          ```bash
          grep "macos" checksums.txt | shasum -a 256 -c
          ```

          ## 📝 Notes

          - This release contains native builds for the supported architectures above.
          - Shared documentation is included in all builds.
          EOF

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-file release-notes.md release-files/*
