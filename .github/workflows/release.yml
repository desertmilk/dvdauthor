name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            asset: dvdauthor-linux-x86_64.tar.gz
          - os: macos-latest
            name: macos
            asset: dvdauthor-macos-x86_64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config m4 flex bison \
            libdvdread-dev libpng-dev libxml2-dev libfontconfig1-dev \
            libfreetype6-dev libfribidi-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install autoconf automake libtool pkg-config m4 flex bison \
            libdvdread libpng libxml2 fontconfig freetype fribidi

      - name: Bootstrap and build
        shell: bash
        run: |
          set -eux
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export PATH="$(brew --prefix)/opt/bison/bin:$(brew --prefix)/opt/flex/bin:$PATH"
          fi
          ./bootstrap
          ./configure --prefix="$PWD/_install"
          CPU_COUNT="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          make -j"$CPU_COUNT"
          make install-strip

          mkdir -p release
          tar -C "$PWD/_install" -czf "release/${{ matrix.asset }}" .

      - name: Create source distribution
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eux
          make dist
          cp -f ./*.tar.gz release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes release/*
